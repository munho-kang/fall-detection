<!doctype html>
<!-- Pages를 '브랜치에서 배포' 모드로 설정한 경우의 안전망 — 사이트 루트에서 감지 페이지(web/)로 보낸다 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=web/" />
    <script>
      location.replace("web/");
    </script>
    <title>낙상 감지 시스템</title>
  </head>
  <body>
    <p>이동하지 않으면 <a href="web/">여기</a>를 누르세요.</p>
  </body>
</html>
