<!doctype html>
<!-- 보호자 계정을 새로 만드는 회원가입 화면 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>낙상 감지 — 회원가입</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="card">
      <h1>회원가입</h1>
      <form id="form">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />
        <label for="confirm">비밀번호 확인</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
        <button type="submit">가입하기</button>
      </form>
      <p class="error" id="error"></p>
      <p class="alt-link">이미 계정이 있나요? <a href="index.html">로그인</a></p>
      <p class="privacy">비밀번호는 8자 이상이어야 하고, 숫자만으로는 만들 수 없습니다.</p>
    </div>

    <script type="module">
      import { signup, setToken } from "./js/api.js";

      const form = document.getElementById("form");
      const error = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        if (form.password.value !== form.confirm.value) {
          error.textContent = "비밀번호가 서로 다릅니다.";
          return;
        }
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          setToken(await signup(form.username.value, form.password.value));
          location.href = "detect.html"; // 가입 = 로그인. 바로 감지 화면으로 간다.
        } catch (err) {
          error.textContent = err.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
