<!doctype html>
<!-- 보호자 계정으로 로그인해 토큰을 받는 화면 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>낙상 감지 — 로그인</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="card">
      <h1>낙상 감지 시스템</h1>
      <form id="form">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">로그인</button>
      </form>
      <p class="error" id="error"></p>
      <p class="alt-link">계정이 없나요? <a href="signup.html">회원가입</a></p>
      <p class="privacy">
        이 페이지는 웹캠 영상을 브라우저 안에서만 처리합니다. 영상과 관절 좌표는 서버로 전송되지
        않습니다.
      </p>
    </div>

    <script type="module">
      import { login, setToken } from "./js/api.js";

      // 포트 5500(Live Server 기본값)을 쓰던 다른 프로젝트의 워커가 오리진에 남아
      // 페이지 이동을 가로챈 사고가 있었다. 우리 워커(skipWaiting/claim)로 즉시 대체한다.
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});

      // clean-URL 서버(npx serve류)가 남긴 `detect.html → 301 /detect` 응답이 HTTP 캐시에 박혀
      // 로그인 후 이동이 열흘간 404로 가는 사고도 있었다(DevTools의 Clear site data로도 안 지워진다).
      // 이동 대상을 캐시 우회로 다시 받아, 오염된 항목을 정상 200으로 덮어쓴다.
      fetch("detect.html", { cache: "reload" }).catch(() => {});

      const form = document.getElementById("form");
      const error = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          setToken(await login(form.username.value, form.password.value));
          // 캐시 키를 바꿔, 위 덮어쓰기가 아직 안 끝났더라도 오염된 301 캐시를 확실히 비껴간다
          location.href = `detect.html?t=${Date.now()}`;
        } catch (err) {
          error.textContent = err.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
