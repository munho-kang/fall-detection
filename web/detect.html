<!doctype html>
<!-- 방을 선택하고 웹캠으로 낙상을 감지하는 화면 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>낙상 감지 — 감지 중</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="banner" class="banner hidden"></div>

    <div id="setup" class="card">
      <h1>감지할 방 선택</h1>
      <label for="roomSelect">방</label>
      <select id="roomSelect"></select>
      <p class="error hidden" id="noRooms">등록된 방이 없습니다. 아래에서 먼저 추가하세요.</p>
      <details id="addRoom">
        <summary>새 방 추가</summary>
        <label for="newRoomName">방 이름</label>
        <input id="newRoomName" maxlength="20" placeholder="안방" />
        <label for="newRoomNumber">방 번호</label>
        <input id="newRoomNumber" type="number" value="1" min="1" max="99" />
        <button type="button" id="addRoomBtn">추가</button>
      </details>
      <button id="start" disabled>감지 시작</button>
      <p class="error" id="error"></p>
    </div>

    <div id="stage" class="hidden">
      <!-- MediaPipe 입력용. 화면에는 절대 표시하지 않는다. -->
      <video id="video" playsinline hidden></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div id="status">
        <h1 id="room"></h1>
        <div id="state">—</div>
        <p class="metric" id="metrics"></p>
        <p id="escalation" class="hidden"></p>
        <p class="metric" id="sent">전송된 낙상 0건</p>
        <!-- 임계값 실측 튜닝용. 튜닝이 끝나면 이 블록과 js/tuning.js를 함께 제거한다. -->
        <div class="tuning">
          <p class="metric" id="peak"></p>
          <p class="metric">동작 하나를 마칠 때마다 <b>r</b> 키로 시행을 끊는다.</p>
          <button id="download">CSV 다운로드</button>
        </div>
        <div class="privacy">
          검은 배경 위 스켈레톤이 전부입니다. 영상과 관절 좌표는 이 브라우저를 벗어나지 않습니다.
          마이크는 낙상 확인 응급 구간에만 켜지고, 그 음성은 브라우저 음성 인식(구글 서버)으로 처리됩니다.
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
