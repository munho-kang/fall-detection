server:
  port: 8000
  address: 0.0.0.0    # 같은 와이파이 기기의 접속을 받는다

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/fall_detection
    username: ${USER}    # Homebrew Postgres — 로컬 macOS 사용자, 비밀번호 없음
    password: ""
  jpa:
    hibernate:
      ddl-auto: none     # 스키마는 Flyway가 소유한다
    open-in-view: false
